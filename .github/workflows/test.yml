name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR/branch supersedes a run still going; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The runner image ships the Android SDK; AGP finds it through ANDROID_HOME.
      - name: Unit tests
        run: ./gradlew --console=plain test
