name: Release

on:
  push:
    tags:
      # Plain numeric versions such as 1.2.3 (no "v" prefix), like the server.
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # -PsplitAbi makes one APK per CPU (arm64-v8a, armeabi-v7a, x86_64, x86).
      - name: Build
        run: ./gradlew --console=plain :app:assembleRelease -PsplitAbi -PversionName=${{ github.ref_name }} -PversionCode=${{ github.run_number }}

      # AGP leaves release APKs unsigned; sign them with the keystore kept in repo secrets.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir signed
          for apk in app/build/outputs/apk/release/*-release-unsigned.apk; do
            name=$(basename "$apk" -release-unsigned.apk)
            "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --out "signed/${name}-${{ github.ref_name }}.apk" "$apk"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" signed/*.apk --title "${{ github.ref_name }}" --generate-notes
