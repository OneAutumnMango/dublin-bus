name: Appium

on:
  # TEMPORARY: lets the branch run before this file exists on main (remove before merge)
  push:
    branches: [feat/appium-tests]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  appium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Hardware acceleration for the emulator (udev rule from the android-emulator-runner README).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator reaches the host's fake server (started by the tests) at 10.0.2.2:8080.
      - name: Build debug APK
        run: |
          printf 'sdk.dir=%s\nserver.baseUrl=http://10.0.2.2:8080/\n' "$ANDROID_HOME" > local.properties
          ./gradlew --console=plain :app:assembleDebug

      - name: Install test tooling
        working-directory: appium
        run: |
          pip install -r requirements.txt
          npm ci
          npm run drivers

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_atd-x86_64-v1

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Each script line runs in its own shell, so env vars are set per line.
      - name: Smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot-save
          script: |
            mkdir -p appium/artifacts
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            cd appium && APPIUM_HOME=$PWD/.appium nohup npx appium > artifacts/appium.log 2>&1 &
            for i in $(seq 1 60); do curl -sf --max-time 2 -o /dev/null http://127.0.0.1:4723/status && break; sleep 1; done; curl -sf --max-time 2 -o /dev/null http://127.0.0.1:4723/status
            cd appium && python -m pytest --reruns 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-artifacts
          path: appium/artifacts
          if-no-files-found: ignore
