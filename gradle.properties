# This WSL2 instance has 7.7GB total RAM, shared with an emulator (~1.5-2GB) and the Kotlin
# daemon. 3g + parallel workers was enough on its own to OOM-crash WSL - keep this bounded.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
